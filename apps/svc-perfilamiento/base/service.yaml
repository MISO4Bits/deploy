# Solo interno — Perfilamiento no se expone públicamente, lo llama
# Cotización y Rating (lectura GET /perfiles/{clienteId}) dentro del
# cluster, sin Gateway/HTTPRoute aquí, igual que svc-core y svc-cotizacion.
apiVersion: v1
kind: Service
metadata:
  name: svc-perfilamiento
  labels:
    app: svc-perfilamiento
spec:
  selector:
    app: svc-perfilamiento
  ports:
    - name: http
      port: 80
      targetPort: http
