# Cuenta de servicio de Kubernetes (KSA) del pod de svc-perfilamiento. La
# anotación la conecta, vía federación de identidades de carga de trabajo
# (Workload Identity Federation), con la GSA dedicada que crea
# `iac-gcp-dev/modules/pubsub` (clave `svc-perfilamiento` del mapa
# `service_accounts`) — una sola GSA para las dos cosas que este servicio
# hace sobre el tópico compartido: publica (PerfilCalculado) Y consume su
# suscripción (ConsentimientoOtorgado/ConsentimientoRevocado), porque una
# KSA solo puede federarse con una GSA a la vez.
#
# El correo sale de `terraform output pubsub_service_account_emails` después
# de aplicar iac-gcp-dev — se arma de forma predecible a partir de la clave
# `svc-perfilamiento` (account_id `svc-perfilamiento-pubsub`), pero
# confirmar con el output real si ese mapa cambia.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-perfilamiento
  annotations:
    iam.gke.io/gcp-service-account: svc-perfilamiento-pubsub@solventa-dev.iam.gserviceaccount.com
