apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-perfilamiento
  labels:
    app: svc-perfilamiento
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-perfilamiento
  template:
    metadata:
      labels:
        app: svc-perfilamiento
    spec:
      serviceAccountName: svc-perfilamiento
      volumes:
        - name: datos
          emptyDir: {}
      containers:
        - name: svc-perfilamiento
          # Tag placeholder — cada overlay lo sobrescribe con el bloque
          # `images:` de su kustomization.yaml (DI-007, 5.2). No dejar un
          # tag de ambiente real aquí: base/ es compartido entre
          # overlays/dev y overlays/prod.
          image: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/svc-perfilamiento:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PERF_ENVIRONMENT
              value: dev
            # Perfiles, consentimientos y señales de las fuentes en SQLite
            # (Cloud Spanner llega con DI-009). El archivo vive en un emptyDir:
            # sobrevive a un reinicio del contenedor pero no al pod, y cada
            # réplica tendría el suyo — por eso replicas: 1. Si se pierde, el
            # cliente captura sus datos a mano hasta que vuelva a consentir.
            - name: PERF_REPOSITORY_BACKEND
              value: sqlite
            - name: PERF_DATABASE_PATH
              value: /data/perfilamiento.db
            # Open Finance/Open Data reales apuntando al mock de WireMock
            # (deploy/apps/wiremock) — mismo pod para los dos, distinguido
            # por prefijo de ruta.
            - name: PERF_ADAPTERS
              value: http
            - name: PERF_OPEN_FINANCE_BASE_URL
              value: http://wiremock.wiremock.svc.cluster.local/open-finance
            - name: PERF_OPEN_DATA_BASE_URL
              value: http://wiremock.wiremock.svc.cluster.local/open-data
            # Publicación real de PerfilCalculado/PerfilInvalidado + consumo real
            # de ClienteRegistrado/ConsentimientoOtorgado/ConsentimientoRevocado
            # vía Pub/Sub —
            # tópico y suscripción aprovisionados en
            # iac-gcp-dev/modules/pubsub. Requiere el serviceAccountName de
            # arriba (permiso de publicador + suscriptor vía Workload
            # Identity Federation).
            - name: PERF_EVENT_BACKEND
              value: pubsub
            - name: PERF_PUBSUB_PROJECT_ID
              value: solventa-dev
            # Observabilidad (DI-008): activa el SDK de OpenTelemetry
            # (deshabilitado por defecto en config.py). Exporta hacia el
            # receptor de Alloy dentro del mismo cluster (namespace
            # observability, ver iac-gcp-dev/modules/observability).
            - name: PERF_OTEL_ENABLED
              value: "true"
          volumeMounts:
            - name: datos
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
