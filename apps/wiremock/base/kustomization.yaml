namespace: wiremock

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

# Un archivo por escenario (más fácil de revisar en PR y de extender según
# necesite cada experimento) — kustomize genera el ConfigMap con el nombre
# de archivo como key y reescribe automáticamente la referencia en
# deployment.yaml al hash del contenido (fuerza un rollout si cambian los
# mappings).
configMapGenerator:
  - name: wiremock-mappings
    files:
      - mappings/open-finance-david-alto-riesgo.json
      - mappings/open-finance-daniel-bajo-riesgo.json
      - mappings/open-finance-sofia-riesgo-medio.json
      - mappings/open-finance-nicolas-sin-hipotecario.json
      - mappings/open-finance-valentina-tres-hipotecas.json
      - mappings/open-finance-timeout.json
      - mappings/open-finance-error.json
      - mappings/open-finance-solo-error.json
      - mappings/open-finance-default.json
      - mappings/open-data-david-alto-riesgo.json
      - mappings/open-data-daniel-bajo-riesgo.json
      - mappings/open-data-sofia-riesgo-medio.json
      - mappings/open-data-nicolas-sin-hipotecario.json
      - mappings/open-data-valentina-tres-hipotecas.json
      - mappings/open-data-timeout.json
      - mappings/open-data-error.json
      - mappings/open-data-default.json
      # Personas del Sprint 2 (BITS-313): números 2026xxxxxx, propios de las
      # cuentas de prueba de este sprint, para no chocar con las cuentas que el
      # equipo registra con las personas de arriba.
      - mappings/open-finance-camila-riesgo-bajo.json
      - mappings/open-finance-andres-alto-riesgo.json
      - mappings/open-finance-lucia-sin-hipotecario.json
      - mappings/open-finance-mateo-dos-hipotecas.json
      - mappings/open-finance-paula-hipoteca-grande.json
      - mappings/open-finance-jorge-factores-mixtos.json
      - mappings/open-finance-s2-lento.json
      - mappings/open-finance-s2-ambas-caidas.json
      - mappings/open-finance-s2-solo-finance-caida.json
      - mappings/open-data-camila-riesgo-bajo.json
      - mappings/open-data-andres-alto-riesgo.json
      - mappings/open-data-lucia-sin-hipotecario.json
      - mappings/open-data-mateo-dos-hipotecas.json
      - mappings/open-data-paula-hipoteca-grande.json
      - mappings/open-data-jorge-factores-mixtos.json
      - mappings/open-data-s2-lento.json
      - mappings/open-data-s2-ambas-caidas.json
