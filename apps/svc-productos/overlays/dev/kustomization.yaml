resources:
- ../../base

# Tag real de este ambiente — ver la misma nota en apps/bff-web/overlays/dev.
# Todavía no existe ninguna imagen publicada de svc-productos: `develop` es un
# marcador que deja el pod en ImagePullBackOff hasta que el pipeline de CI
# corra por primera vez en develop y el write-back (job `deploy` de su
# ci.yml) lo reemplace por el tag inmutable sha-<corto>.
images:
- name: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/svc-productos
  newName: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/svc-productos
  newTag: sha-2a3010d
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
