# Solo interno — Productos y Configuración de Mercado no se expone
# públicamente, únicamente lo llama BFF Web dentro del cluster (sin
# Gateway/HTTPRoute aquí), igual que svc-core y svc-cotizacion.
apiVersion: v1
kind: Service
metadata:
  name: svc-productos
  labels:
    app: svc-productos
spec:
  selector:
    app: svc-productos
  ports:
    - name: http
      port: 80
      targetPort: http
