apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-web
  labels:
    app: fe-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fe-web
  template:
    metadata:
      labels:
        app: fe-web
    spec:
      containers:
        - name: fe-web
          image: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/fe-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20