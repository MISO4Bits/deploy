# Cluster-scoped (Gateway API estándar) — sin namespace. Registra a
# apisix-ingress-controller como el controlador que atiende cualquier
# Gateway con este gatewayClassName.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: apisix
spec:
  controllerName: apisix.apache.org/apisix-ingress-controller
