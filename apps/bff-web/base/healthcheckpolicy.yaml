# El balanceador de carga que crea el Gateway de arriba genera su propio
# health check, separado del readinessProbe de Kubernetes — por defecto
# prueba la ruta "/", que en bff-web devuelve 404 (solo existen /health y
# las rutas de la API). Sin esto, el balanceador marca el backend como no
# sano y devuelve 503 al cliente, aunque el pod esté perfectamente Ready
# según Kubernetes — son dos chequeos de salud independientes que no se
# hablan entre sí.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: bff-web
spec:
  targetRef:
    group: ""
    kind: Service
    name: bff-web
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
