# Monta la API key de Identity Platform como archivo, vía el add-on de
# Secret Manager de GKE (interfaz de almacenamiento de contenedores, CSI).
# El nombre de archivo (`path`) importa: pydantic-settings (bff-web/app/
# config.py, `secrets_dir="/var/secrets"`) busca un archivo cuyo nombre
# coincida con la variable de entorno equivalente, prefijo BFF_ incluido.
#
# El contenedor del secreto (sin valor) lo crea iac-gcp-dev/modules/secrets
# — el valor se sube a mano después de aplicar (ver su README).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bff-web-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/solventa-dev/secrets/identity-platform-api-key/versions/latest"
        path: "BFF_IDENTITY_API_KEY"
