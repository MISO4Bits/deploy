apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-web
  labels:
    app: bff-web
spec:
  replicas: 1
  # Reemplaza el pod viejo en su propio hueco en vez de pedir uno extra
  # (maxSurge: 0). El cluster de dev está al tope de capacidad (cuota global
  # de vCPU y de SSD regional del proyecto, pods/memoria de los 2 nodos
  # comprometidos casi al 100%): con el default (surge 25%) el pod nuevo
  # quedaba Pending indefinido y el rollout nunca terminaba (visto
  # 2026-09-19). Costo: unos segundos sin bff-web en cada despliegue, con
  # una sola réplica en dev. Quitarlo cuando haya capacidad/HPA.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: bff-web
  template:
    metadata:
      labels:
        app: bff-web
    spec:
      serviceAccountName: bff-web
      containers:
        - name: bff-web
          # Tag placeholder — cada overlay lo sobrescribe con el bloque
          # `images:` de su kustomization.yaml (DI-007, 5.2: el write-back
          # de CI edita esa sección con `kustomize edit set image`, no este
          # archivo). No dejar un tag de ambiente real aquí: base/ es
          # compartido entre overlays/dev y overlays/prod.
          image: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/bff-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BFF_ENVIRONMENT
              value: dev
            # "http": identidad y CoreTransaccional reales (ambos van
            # juntos, ver app/adapters/factory.py — no hay modo mixto).
            - name: BFF_ADAPTERS
              value: http
            # Identity Platform real, no el emulador local de Firebase Auth
            # (ese es el default en config.py). La API key la lee
            # pydantic-settings del archivo montado por el SecretProviderClass
            # de abajo (secrets_dir, ver config.py) — no va aquí como env var.
            - name: BFF_IDENTITY_BASE_URL
              value: https://identitytoolkit.googleapis.com
            # DNS interno del Service de svc-core (namespace svc-core,
            # puerto 80 -> containerPort 8080 del pod).
            - name: BFF_CORE_BASE_URL
              value: http://svc-core.svc-core.svc.cluster.local
            # DNS interno del Service de svc-cotizacion (namespace
            # svc-cotizacion, EXP-01/BITS-81). svc-cotizacion cae a tarifa
            # estandar si Perfilamiento no responde — no bloquea la cotización.
            - name: BFF_COTIZACION_BASE_URL
              value: http://svc-cotizacion.svc-cotizacion.svc.cluster.local
            # Observabilidad (DI-008): activa el SDK de OpenTelemetry
            # (deshabilitado por defecto en config.py). Exporta hacia el
            # receptor de Alloy dentro del mismo cluster (namespace
            # observability, ver iac-gcp-dev/modules/observability).
            - name: BFF_OTEL_ENABLED
              value: "true"
            # Ampliado de 1h (default) a 4h para EXP-01 (punto de quiebre de
            # svc-cotizacion con k6, 2026-09-19): un solo usuario/token
            # reutilizado durante todo el ramp de 500 a 50.000
            # cotizaciones/min, sin lógica de refresco a mitad de prueba.
            - name: BFF_SESSION_TTL_SECONDS
              value: "14400"
          volumeMounts:
            - name: identity-platform-secret
              mountPath: /var/secrets
              readOnly: true
          # Bursting habilitado (2026-09-19, para EXP-01): requests se queda
          # en el piso de Autopilot hasta que tengamos uso real medido bajo
          # carga (ver k6/exp-01-punto-de-quiebre.js en svc-cotizacion) —
          # limits por encima permite absorber picos sin throttling de CPU,
          # que es justo lo que distorsionaría el punto de quiebre que
          # estamos buscando. Sin costo adicional: Autopilot factura por
          # requests, no por el techo de limits (ver GKE docs, "Configure
          # Pod bursting in GKE"). Requiere GKE >= 1.30.2-gke.1394000 (este
          # cluster corre 1.35.8, ya cumple).
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: identity-platform-secret
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bff-web-secrets
