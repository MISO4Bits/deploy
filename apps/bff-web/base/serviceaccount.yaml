# Cuenta de servicio de Kubernetes (KSA) del pod de bff-web. La anotación
# la conecta, vía federación de identidades de carga de trabajo (Workload
# Identity Federation), con la cuenta de servicio de Google (GSA) dedicada
# que crea `iac-gcp-dev/modules/secrets` — mínimo privilegio: esa GSA solo
# puede leer el secreto de Identity Platform, nada más.
#
# El correo de la GSA sale de `terraform output
# secret_reader_service_account_emails` después de aplicar iac-gcp-dev — se
# arma de forma predecible a partir de la clave `bff-web-secrets` del mapa
# en modules/secrets, pero confirmar con el output real si ese mapa cambia.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff-web
  annotations:
    iam.gke.io/gcp-service-account: bff-web-secrets@solventa-dev.iam.gserviceaccount.com
