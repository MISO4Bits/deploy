# Expone BFF Web con una dirección pública estable dentro del cluster
# (Gateway API de GKE, gke-l7-global-external-managed crea un Global
# External Application Load Balancer). La dirección se asigna en cuanto
# este Gateway se sincroniza, sin importar si el Deployment ya tiene una
# imagen real corriendo detrás — eso es justo lo que se necesita para el
# x-google-backend del API Gateway en iac-gcp-dev/modules/ingress.
#
# Dev por ahora: HTTP plano, sin dominio ni certificado propios. Revisar
# para iac-gcp-prod — ese tramo interno sí necesita TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bff-web
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-web
spec:
  parentRefs:
    - name: bff-web
  rules:
    - backendRefs:
        - name: bff-web
          port: 80
