# Expone BFF Web con una dirección pública estable dentro del cluster
# (Gateway API de GKE, gke-l7-global-external-managed crea un Global
# External Application Load Balancer). Es lo que llama el API Gateway de
# iac-gcp-dev/modules/ingress vía x-google-backend — API Gateway solo
# puede llamar direcciones públicas, no tiene conectividad privada a VPCs.
#
# IP fija (no efímera): referencia por nombre la IP reservada en
# iac-gcp-dev/persistent/ (estado de Terraform separado que nunca se
# destruye). Se evaluó reservarla en iac-gcp-admin en vez de en
# solventa-dev — descartado, el Gateway de GKE no acepta direcciones
# estáticas de otro proyecto (confirmado por experimento).
#
# Certificado gestionado vía Certificate Manager (anotación
# networking.gke.io/certmap, no tls.certificateRefs — son mecanismos
# excluyentes) — también creado en persistent/, para el dominio
# bff-web.dev.solventa4bits.com.
#
# Certificado ACTIVE y HTTPS confirmado funcionando (2026-09-12) — el
# listener HTTP temporal ya se quitó. Todo el tráfico entra cifrado; no hay
# bypass en texto plano hacia bff-web.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bff-web
  annotations:
    networking.gke.io/certmap: bff-web-dev-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: bff-web-dev
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      # Sin bloque tls: la doc oficial de GKE (Secure a Gateway) lo omite a
      # propósito cuando se usa la anotación networking.gke.io/certmap — el
      # certificado lo resuelve la anotación, no este campo. La regla CEL del
      # CRD (certificateRefs>0 || options>0 si mode=Terminate) solo se activa
      # si el objeto tls existe; omitirlo evita esa validación por completo.
      # Ya se intentó declarar tls.mode=Terminate con una clave inventada en
      # options para satisfacer esa regla — pasó el dry-run del API server
      # pero el controlador real de GKE la rechazó después (Error GWCER105:
      # invalid TLS option key), un fallo asíncrono que Argo CD no detecta
      # porque solo valida contra el API server, no contra la traducción a
      # recursos de GCP.
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-web
spec:
  parentRefs:
    - name: bff-web
  rules:
    - backendRefs:
        - name: bff-web
          port: 80
