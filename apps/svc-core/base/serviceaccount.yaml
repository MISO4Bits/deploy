# Cuenta de servicio de Kubernetes (KSA) del pod de svc-core. La anotación
# la conecta, vía federación de identidades de carga de trabajo (Workload
# Identity Federation), con la GSA dedicada que crea
# `iac-gcp-dev/modules/pubsub` (clave `svc-core` del mapa `service_accounts`)
# — mínimo privilegio: esa GSA solo puede publicar en el tópico compartido
# de eventos de dominio, nada más.
#
# El correo sale de `terraform output pubsub_service_account_emails` después
# de aplicar iac-gcp-dev — se arma de forma predecible a partir de la clave
# `svc-core` (account_id `svc-core-pubsub`), pero confirmar con el output
# real si ese mapa cambia.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-core
  annotations:
    iam.gke.io/gcp-service-account: svc-core-pubsub@solventa-dev.iam.gserviceaccount.com
