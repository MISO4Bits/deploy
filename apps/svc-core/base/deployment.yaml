apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-core
  labels:
    app: svc-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-core
  template:
    metadata:
      labels:
        app: svc-core
    spec:
      containers:
        - name: svc-core
          # Tag placeholder — cada overlay lo sobrescribe con el bloque
          # `images:` de su kustomization.yaml (DI-007, 5.2). No dejar un
          # tag de ambiente real aquí: base/ es compartido entre
          # overlays/dev y overlays/prod.
          image: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/svc-core:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Persistencia SQLite dentro del contenedor (default de la app)
            # — efímera, se pierde en cada restart del pod. El adaptador de
            # Cloud Spanner (ya aprovisionado en modules/spanner) todavía no
            # existe en el código de svc-core (pendiente, ver
            # component-docs-and-repos). Publicación de eventos: "logging"
            # (default), sin Pub/Sub real todavía.
            - name: CORE_ENVIRONMENT
              value: dev
            # Observabilidad (DI-008): activa el SDK de OpenTelemetry
            # (deshabilitado por defecto en config.py). Exporta hacia el
            # receptor de Alloy dentro del mismo cluster (namespace
            # observability, ver iac-gcp-dev/modules/observability).
            - name: CORE_OTEL_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
