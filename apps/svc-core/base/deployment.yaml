apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-core
  labels:
    app: svc-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-core
  template:
    metadata:
      labels:
        app: svc-core
    spec:
      serviceAccountName: svc-core
      containers:
        - name: svc-core
          # Tag placeholder — cada overlay lo sobrescribe con el bloque
          # `images:` de su kustomization.yaml (DI-007, 5.2). No dejar un
          # tag de ambiente real aquí: base/ es compartido entre
          # overlays/dev y overlays/prod.
          image: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/svc-core:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Persistencia SQLite dentro del contenedor (default de la app)
            # — efímera, se pierde en cada restart del pod. El adaptador de
            # Cloud Spanner (ya aprovisionado en modules/spanner) todavía no
            # existe en el código de svc-core (pendiente, ver
            # component-docs-and-repos).
            - name: CORE_ENVIRONMENT
              value: dev
            # Publicación real de ConsentimientoOtorgado/ConsentimientoRevocado
            # (y ClienteRegistrado) hacia Pub/Sub — tópico compartido
            # aprovisionado en iac-gcp-dev/modules/pubsub. Requiere el
            # serviceAccountName de arriba (permiso de publicador vía
            # Workload Identity Federation). Reactivado (2026-09-18) tras
            # mergear feature/BITS-105_pubsub-consentimiento — la imagen
            # ya incluye la dependencia google-cloud-pubsub.
            - name: CORE_EVENT_BACKEND
              value: pubsub
            - name: CORE_PUBSUB_PROJECT_ID
              value: solventa-dev
            # Correos del registro (BITS-93): Core arma la bienvenida y la
            # verificación de correo (plantilla de svc-productos + enlace de
            # Identity Platform) y publica EnviarCorreo para fn-notificaciones.
            # Un fallo aquí solo se registra; nunca afecta al registro.
            # Requiere el rol de administración de Identity Platform en la
            # GSA svc-core-pubsub (iac-gcp-dev) y las URL de la web por defecto
            # (https://solventa4bits.com, ruta /verificar-correo).
            - name: CORE_NOTIFICACIONES_BACKEND
              value: real
            - name: CORE_IDENTITY_PROJECT_ID
              value: solventa-dev
            - name: CORE_PRODUCTOS_BASE_URL
              value: http://svc-productos.svc-productos.svc.cluster.local
            # Evidencias de identidad (BITS-275): fotos de la cédula y selfie. Se
            # guardan en un bucket privado (iac-gcp-dev/modules/evidencias; el
            # acceso sale de la misma cuenta de servicio de arriba) y el análisis
            # de la imagen corre dentro del propio pod: no llama a ningún servicio
            # externo. Los umbrales de calidad (CORE_CALIDAD_*) son provisionales
            # hasta calibrarlos con fotos reales; si rechazan fotos buenas se
            # relajan aquí sin cambiar código. Con CORE_VERIFICADOR_BACKEND=mock
            # el servicio devuelve veredictos configurables sin mirar la imagen.
            - name: CORE_ALMACEN_BACKEND
              value: gcs
            - name: CORE_ALMACEN_BUCKET
              value: solventa-dev-evidencias
            - name: CORE_VERIFICADOR_BACKEND
              value: local
            # Selfie (BITS-235): prueba de vida pasiva y comparación con el frente de
            # la cédula, con los modelos de OpenCV que van dentro de la imagen
            # (/app/models). Los modelos se cargan al arrancar: si faltan, el pod no
            # arranca. Los umbrales (CORE_BIOMETRIA_*) son provisionales hasta
            # calibrarlos con fotos reales; si rechazan selfies buenas se relajan aquí
            # sin cambiar código. Con CORE_BIOMETRIA_BACKEND=mock el servicio devuelve
            # veredictos configurables sin mirar la imagen.
            - name: CORE_BIOMETRIA_BACKEND
              value: local
            # Pólizas (BITS-101): Core lee la cotización activa por la ruta interna de
            # svc-cotizacion (no pasa por el gateway) y consume CotizacionCreada /
            # CotizacionEliminada para borrar la póliza pendiente de la cotización anterior, y
            # DocumentoPolizaGenerado para encargar el correo con el PDF adjunto (suscripción
            # core-polizas, iac-gcp-dev/modules/pubsub). El enlace del documento de la póliza lo
            # pide a fn-documentos (Cloud Run, módulo iac-gcp-dev/modules/fn-documentos) con un
            # token de identidad de la cuenta de servicio del pod; la URL es la salida
            # `fn_documentos_url` de iac-gcp-dev.
            - name: CORE_DOCUMENTO_BACKEND
              value: http
            - name: CORE_DOCUMENTO_BASE_URL
              value: https://fn-documentos-sfvqabtlya-rj.a.run.app
            # Avisos push (BITS-229): al emitirse una póliza, Core publica EnviarPush con los
            # tokens de los dispositivos registrados del cliente y fn-notificaciones lo entrega
            # por Firebase (suscripción notificaciones-enviar-push, iac-gcp-dev/modules/
            # fn-notificaciones). Un fallo aquí solo se registra; nunca afecta a la emisión.
            - name: CORE_PUSH_BACKEND
              value: "on"
            - name: CORE_COTIZACION_BACKEND
              value: http
            - name: CORE_COTIZACION_BASE_URL
              value: http://svc-cotizacion.svc-cotizacion.svc.cluster.local
            - name: CORE_CONSUMIDOR_BACKEND
              value: pubsub
            - name: CORE_PUBSUB_SUBSCRIPTION
              value: core-polizas
            # Saldo del crédito al reportar un siniestro (BITS-381): Core lo lee una sola vez, al
            # radicar, del DNS interno de svc-perfilamiento (GET /clientes/{id}/creditos-hipotecarios,
            # lo que Open Finance ya trajo al otorgarse el consentimiento) y lo guarda con el
            # siniestro: es lo que se paga al banco. Si svc-perfilamiento no responde, falla o no hay
            # consentimiento, el reporte se radica igual con el saldo de la póliza
            # (origen: POLIZA). Sin esta variable Core usa el doble local, que nunca trae hipotecas.
            - name: CORE_CREDITOS_BACKEND
              value: http
            - name: CORE_PERFILAMIENTO_BASE_URL
              value: http://svc-perfilamiento.svc-perfilamiento.svc.cluster.local
            # Cuentas del personal de Solventa (BITS-374): POST /v1/usuarios-internos crea
            # administradores y socios en Identity Platform (interno, sin gateway: lo llama
            # bff-web). Al arrancar, Core crea el administrador de la semilla si no existe, en
            # segundo plano y sin tumbar el arranque si falla; nunca pisa una cuenta existente.
            # La contraseña maestra no va aquí: se monta como archivo desde Secret Manager
            # (secretproviderclass.yaml) y la lee la configuración de /var/secrets.
            - name: CORE_CUENTAS_INTERNAS_BACKEND
              value: real
            - name: CORE_ADMIN_SEED_EMAIL
              value: admin@solventa4bits.com
            # Observabilidad (DI-008): activa el SDK de OpenTelemetry
            # (deshabilitado por defecto en config.py). Exporta hacia el
            # receptor de Alloy dentro del mismo cluster (namespace
            # observability, ver iac-gcp-dev/modules/observability).
            - name: CORE_OTEL_ENABLED
              value: "true"
          volumeMounts:
            - name: svc-core-secrets
              mountPath: /var/secrets
              readOnly: true
          # 1 vCPU / 1 Gi (antes 250m / 512 Mi): los modelos de la selfie (BITS-235)
          # corren en este mismo pod, y con un límite de procesador el estrangulamiento
          # afecta a todo el contenedor, incluidas las transacciones de dinero. Sin
          # medición de carga todavía: si se observa degradación, el análisis se puede
          # sacar del pod detrás del puerto VerificadorBiometrico.
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: svc-core-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: svc-core-secrets
