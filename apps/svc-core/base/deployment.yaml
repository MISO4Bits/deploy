apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-core
  labels:
    app: svc-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-core
  template:
    metadata:
      labels:
        app: svc-core
    spec:
      serviceAccountName: svc-core
      containers:
        - name: svc-core
          # Tag placeholder — cada overlay lo sobrescribe con el bloque
          # `images:` de su kustomization.yaml (DI-007, 5.2). No dejar un
          # tag de ambiente real aquí: base/ es compartido entre
          # overlays/dev y overlays/prod.
          image: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/svc-core:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Persistencia SQLite dentro del contenedor (default de la app)
            # — efímera, se pierde en cada restart del pod. El adaptador de
            # Cloud Spanner (ya aprovisionado en modules/spanner) todavía no
            # existe en el código de svc-core (pendiente, ver
            # component-docs-and-repos).
            - name: CORE_ENVIRONMENT
              value: dev
            # Publicación real de ConsentimientoOtorgado/ConsentimientoRevocado
            # (y ClienteRegistrado) hacia Pub/Sub — tópico compartido ya
            # aprovisionado en iac-gcp-dev/modules/pubsub (permiso de
            # publicador vía el serviceAccountName de arriba). TEMPORALMENTE
            # DESACTIVADO (2026-09-18): la imagen hoy publicada en `develop`
            # todavía no incluye la dependencia google-cloud-pubsub — con
            # CORE_EVENT_BACKEND=pubsub el pod entra en CrashLoopBackOff
            # (ImportError al construir PubSubEventPublisher). Reactivar
            # después de mergear feature/BITS-105_pubsub-consentimiento y
            # que el write-back de CI actualice el tag de esta imagen.
            - name: CORE_EVENT_BACKEND
              value: logging
            # Observabilidad (DI-008): activa el SDK de OpenTelemetry
            # (deshabilitado por defecto en config.py). Exporta hacia el
            # receptor de Alloy dentro del mismo cluster (namespace
            # observability, ver iac-gcp-dev/modules/observability).
            - name: CORE_OTEL_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
