# Monta la contraseña maestra del administrador de la semilla (BITS-374) como archivo, vía el
# add-on de Secret Manager de GKE (interfaz de almacenamiento de contenedores, CSI).
# El nombre de archivo (`path`) importa: pydantic-settings (svc-core/app/config.py,
# `secrets_dir="/var/secrets"`) busca un archivo cuyo nombre coincida con la variable de entorno
# equivalente, prefijo CORE_ incluido.
#
# El contenedor del secreto (sin valor) lo crea iac-gcp-dev/persistent/secretos.tf y sobrevive al
# destroy; el valor lo sube David a mano (`gcloud secrets versions add admin-seed-password`).
# La cuenta de servicio del pod (svc-core-pubsub) lee el secreto por el permiso que le da
# iac-gcp-dev/main.tf (core_admin_seed_password).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: svc-core-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/solventa-dev/secrets/admin-seed-password/versions/latest"
        path: "CORE_ADMIN_SEED_PASSWORD"
