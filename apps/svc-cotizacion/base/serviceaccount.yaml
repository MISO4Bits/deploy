# Cuenta de servicio de Kubernetes (KSA) del pod de svc-cotizacion. La
# anotación la conecta, vía federación de identidades de carga de trabajo
# (Workload Identity Federation), con la GSA dedicada que crea
# `iac-gcp-dev/modules/pubsub` (clave `svc-cotizacion` del mapa
# `service_accounts`) — mínimo privilegio: esa GSA solo puede consumir su
# suscripción de ConsentimientoRevocado, nada más (Cotización nunca
# publica en el tópico compartido).
#
# El correo sale de `terraform output pubsub_service_account_emails`
# después de aplicar iac-gcp-dev — ya confirmado con el output real:
# svc-cotizacion-pubsub@solventa-dev.iam.gserviceaccount.com.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-cotizacion
  annotations:
    iam.gke.io/gcp-service-account: svc-cotizacion-pubsub@solventa-dev.iam.gserviceaccount.com
