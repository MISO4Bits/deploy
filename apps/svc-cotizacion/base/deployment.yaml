apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-cotizacion
  labels:
    app: svc-cotizacion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-cotizacion
  template:
    metadata:
      labels:
        app: svc-cotizacion
    spec:
      serviceAccountName: svc-cotizacion
      containers:
        - name: svc-cotizacion
          # Tag placeholder — cada overlay lo sobrescribe con el bloque
          # `images:` de su kustomization.yaml (DI-007, 5.2). No dejar un
          # tag de ambiente real aquí: base/ es compartido entre
          # overlays/dev y overlays/prod.
          image: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/svc-cotizacion:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # El adaptador de persistencia real contra la instancia
            # compartida de Spanner (ya aprovisionada en modules/spanner)
            # todavía no existe en el código de svc-cotizacion — las
            # cotizaciones siguen en memoria pase lo que pase con
            # COT_ADAPTERS.
            - name: COT_ENVIRONMENT
              value: dev
            # Perfilamiento real (BITS-105): lee GET /perfiles/{clienteId}
            # en vez del perfilador simulado.
            - name: COT_ADAPTERS
              value: http
            - name: COT_PERFILAMIENTO_BASE_URL
              value: http://svc-perfilamiento.svc-perfilamiento.svc.cluster.local
            # Caché de perfiles (Redis, decisión 2026-09-19) — evita pagar
            # la llamada de red a Perfilamiento en cada cotización.
            # Compartido entre réplicas: al escalar, solo la primera
            # lectura de todo el fleet paga esa latencia. Se invalida por
            # evento (ConsentimientoRevocado, requiere el serviceAccountName
            # de arriba); el TTL es la red de seguridad si ese mensaje se
            # pierde.
            - name: COT_CACHE_BACKEND
              value: redis
            - name: COT_REDIS_URL
              value: redis://redis.redis.svc.cluster.local:6379/0
            - name: COT_PUBSUB_PROJECT_ID
              value: solventa-dev
            # Observabilidad (DI-008): activa el SDK de OpenTelemetry
            # (deshabilitado por defecto en config.py). Exporta hacia el
            # receptor de Alloy dentro del mismo cluster (namespace
            # observability, ver iac-gcp-dev/modules/observability).
            - name: COT_OTEL_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
