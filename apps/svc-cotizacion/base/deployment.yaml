apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-cotizacion
  labels:
    app: svc-cotizacion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-cotizacion
  template:
    metadata:
      labels:
        app: svc-cotizacion
    spec:
      serviceAccountName: svc-cotizacion
      volumes:
        - name: datos
          emptyDir: {}
      containers:
        - name: svc-cotizacion
          # Tag placeholder — cada overlay lo sobrescribe con el bloque
          # `images:` de su kustomization.yaml (DI-007, 5.2). No dejar un
          # tag de ambiente real aquí: base/ es compartido entre
          # overlays/dev y overlays/prod.
          image: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/svc-cotizacion:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # La cotización activa de cada cliente (una sola, la nueva reemplaza a la
            # anterior) vive en SQLite hasta que llegue Cloud Spanner (DI-009).
            # El archivo está en un emptyDir: sobrevive a un reinicio del contenedor
            # pero no al pod, y cada réplica tendría el suyo — por eso replicas: 1.
            - name: COT_ENVIRONMENT
              value: dev
            # Perfilamiento real (BITS-105): lee GET /v1/perfiles/{clienteId}
            # en vez del perfilador simulado.
            - name: COT_ADAPTERS
              value: http
            - name: COT_REPOSITORY_BACKEND
              value: sqlite
            - name: COT_DATABASE_PATH
              value: /data/cotizacion.db
            # Tabla de tasas por edad (GET /v1/tarifas/vida-hipotecario): se pide una
            # sola vez y se guarda en Redis (TTL 24 h); cambiarla es editar la semilla
            # de Productos y desplegar.
            - name: COT_PRODUCTOS_BASE_URL
              value: http://svc-productos.svc-productos.svc.cluster.local
            - name: COT_PERFILAMIENTO_BASE_URL
              value: http://svc-perfilamiento.svc-perfilamiento.svc.cluster.local
            # Caché de perfiles (Redis, decisión 2026-09-19) — evita pagar
            # la llamada de red a Perfilamiento en cada cotización.
            # Compartido entre réplicas: al escalar, solo la primera
            # lectura de todo el fleet paga esa latencia. Se invalida por
            # evento (ConsentimientoRevocado, requiere el serviceAccountName
            # de arriba); el TTL es la red de seguridad si ese mensaje se
            # pierde.
            - name: COT_CACHE_BACKEND
              value: redis
            - name: COT_REDIS_URL
              value: redis://redis.redis.svc.cluster.local:6379/0
            - name: COT_PUBSUB_PROJECT_ID
              value: solventa-dev
            # Publica CotizacionCreada / CotizacionEliminada (BITS-101) en el tópico
            # compartido, sin esperar el acuse: cotizar no paga la latencia de Pub/Sub.
            - name: COT_EVENTOS_BACKEND
              value: pubsub
            # Observabilidad (DI-008): activa el SDK de OpenTelemetry
            # (deshabilitado por defecto en config.py). Exporta hacia el
            # receptor de Alloy dentro del mismo cluster (namespace
            # observability, ver iac-gcp-dev/modules/observability).
            - name: COT_OTEL_ENABLED
              value: "true"
          # Bursting habilitado (2026-09-19, para EXP-01): requests se queda
          # en el piso de Autopilot hasta que tengamos uso real medido bajo
          # carga (ver k6/exp-01-punto-de-quiebre.js) — limits por encima
          # permite absorber picos sin throttling de CPU, que es justo lo
          # que distorsionaría el punto de quiebre que estamos buscando.
          # Sin costo adicional: Autopilot factura por requests, no por el
          # techo de limits (ver GKE docs, "Configure Pod bursting in GKE").
          volumeMounts:
            - name: datos
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
