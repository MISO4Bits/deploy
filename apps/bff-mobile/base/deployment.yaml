apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-mobile
  labels:
    app: bff-mobile
spec:
  replicas: 1
  # Reemplaza el pod viejo en su propio hueco en vez de pedir uno extra
  # (maxSurge: 0): el cluster de dev está al tope de capacidad (ver el mismo
  # comentario en apps/bff-web/base/deployment.yaml). Costo: unos segundos sin
  # bff-mobile en cada despliegue, con una sola réplica en dev.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: bff-mobile
  template:
    metadata:
      labels:
        app: bff-mobile
    spec:
      serviceAccountName: bff-mobile
      containers:
        - name: bff-mobile
          # Tag placeholder — cada overlay lo sobrescribe con el bloque
          # `images:` de su kustomization.yaml (DI-007, 5.2). No dejar un
          # tag de ambiente real aquí: base/ es compartido entre
          # overlays/dev y overlays/prod.
          image: southamerica-east1-docker.pkg.dev/solventa-admin/solventa/bff-mobile:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MOBILE_ENVIRONMENT
              value: dev
            # "http": identidad y CoreTransaccional reales (ambos van
            # juntos, ver app/adapters/factory.py — no hay modo mixto).
            - name: MOBILE_ADAPTERS
              value: http
            # Identity Platform real, no el emulador local. La API key la lee
            # pydantic-settings del archivo montado por el SecretProviderClass
            # de abajo — no va aquí como env var.
            - name: MOBILE_IDENTITY_BASE_URL
              value: https://identitytoolkit.googleapis.com
            # DNS interno del Service de svc-core (namespace svc-core,
            # puerto 80 -> containerPort 8080 del pod).
            - name: MOBILE_CORE_BASE_URL
              value: http://svc-core.svc-core.svc.cluster.local
            # DNS interno de svc-perfilamiento y svc-productos: sirven el paso previo
            # a cotizar (GET /v1/creditos-hipotecarios) — las hipotecas que Open
            # Finance ya trajo al otorgarse el consentimiento y la lista de bancos.
            - name: MOBILE_PERFILAMIENTO_BASE_URL
              value: http://svc-perfilamiento.svc-perfilamiento.svc.cluster.local
            - name: MOBILE_PRODUCTOS_BASE_URL
              value: http://svc-productos.svc-productos.svc.cluster.local
            # Observabilidad (DI-008): activa el SDK de OpenTelemetry
            # (deshabilitado por defecto en config.py). Exporta hacia el
            # receptor de Alloy dentro del mismo cluster (namespace
            # observability, ver iac-gcp-dev/modules/observability).
            - name: MOBILE_OTEL_ENABLED
              value: "true"
          volumeMounts:
            - name: identity-platform-secret
              mountPath: /var/secrets
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: identity-platform-secret
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bff-mobile-secrets
