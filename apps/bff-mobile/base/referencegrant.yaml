# bff-mobile no tiene Gateway propio (DI-011) — es un Service interno puro. El
# HTTPRoute del API Gateway vive en el namespace api-gateway y necesita
# referenciar el Service de bff-mobile desde ahí. Gateway API exige un
# ReferenceGrant explícito en el namespace de destino para permitir una
# referencia cruzada de namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-api-gateway
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: api-gateway
  to:
    - group: ""
      kind: Service
      name: bff-mobile
