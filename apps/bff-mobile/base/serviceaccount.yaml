# Cuenta de servicio de Kubernetes (KSA) del pod de bff-mobile. La anotación
# la conecta, vía federación de identidades de carga de trabajo (Workload
# Identity Federation), con una cuenta de servicio de Google (GSA) dedicada
# que solo puede leer el secreto de Identity Platform (mínimo privilegio),
# igual que bff-web.
#
# PENDIENTE (iac-gcp-dev, `modules/secrets`): esa GSA todavía no existe. Hay
# que agregar la clave `bff-mobile-secrets` al mapa de ese módulo (KSA
# `bff-mobile/bff-mobile`, lectura de `identity-platform-api-key`) y aplicar.
# Hasta entonces el pod no puede montar el secreto y no arranca en modo http.
# Confirmar el correo con `terraform output secret_reader_service_account_emails`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff-mobile
  annotations:
    iam.gke.io/gcp-service-account: bff-mobile-secrets@solventa-dev.iam.gserviceaccount.com
