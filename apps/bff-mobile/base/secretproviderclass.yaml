# Monta la API key de Identity Platform como archivo, vía el add-on de
# Secret Manager de GKE (interfaz de almacenamiento de contenedores, CSI).
# El nombre de archivo (`path`) importa: pydantic-settings (bff-mobile/app/
# config.py, `secrets_dir="/var/secrets"`) busca un archivo cuyo nombre
# coincida con la variable de entorno equivalente, prefijo MOBILE_ incluido.
#
# Es el mismo secreto que usa bff-web (`identity-platform-api-key`): la API key
# es del proyecto de Identity Platform, no de un canal.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bff-mobile-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/solventa-dev/secrets/identity-platform-api-key/versions/latest"
        path: "MOBILE_IDENTITY_API_KEY"
